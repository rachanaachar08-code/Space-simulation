<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Moon Mission</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { overflow: hidden; background: #02040c; font-family: Arial, sans-serif; color: white; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #hud {
      position: absolute; top: 15px; left: 15px; right: 15px;
      display: flex; justify-content: space-between; pointer-events: none; z-index: 10;
    }
    .panel {
      background: rgba(11, 19, 43, 0.85); border: 1px solid #3a86ff;
      padding: 12px 16px; border-radius: 10px; font-size: 14px;
    }
    #radarBox {
      width: 110px; height: 110px; border-radius: 50%;
      background: rgba(5, 20, 40, 0.9); border: 2px solid #4cc9f0; position: relative;
    }
    #radarMoon {
      width: 12px; height: 12px; background: #ffd166; border-radius: 50%;
      position: absolute; top: 10px; left: 49px; box-shadow: 0 0 8px #ffd166;
    }
    #radarPlayer {
      width: 8px; height: 8px; background: #00f5d4; border-radius: 50%;
      position: absolute; bottom: 12px; left: 51px;
    }
    #controls {
      position: absolute; bottom: 25px; left: 20px; right: 20px;
      display: flex; justify-content: space-between; z-index: 15;
    }
    .btn-group { display: flex; gap: 10px; }
    button.ctrl {
      width: 60px; height: 60px; border-radius: 50%;
      background: rgba(58, 134, 255, 0.5); border: 2px solid #4cc9f0;
      color: white; font-size: 22px; font-weight: bold; touch-action: manipulation;
    }
    button.ctrl:active { background: #3a86ff; }
    #overlay {
      position: absolute; inset: 0; background: rgba(5, 8, 20, 0.92);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 25px; z-index: 30;
    }
    #overlay h1 { color: #4cc9f0; font-size: 28px; margin-bottom: 12px; }
    #overlay p { color: #a9bcd0; max-width: 420px; margin-bottom: 22px; line-height: 1.5; }
    #startBtn {
      background: #3a86ff; border: none; padding: 15px 34px;
      font-size: 18px; font-weight: bold; color: white; border-radius: 8px; cursor: pointer;
    }
  </style>
</head>
<body>

<div id="hud">
  <div class="panel">
    <div id="phaseText"><strong>Phase 1:</strong> Walk to the Rocket 🚀</div>
    <div id="distText" style="color:#4cc9f0; margin-top:4px;">Distance to Moon: 1000 km</div>
    <div id="hpText" style="color:#ff4d4d; margin-top:4px;">Hull Integrity: 100%</div>
  </div>
  <div id="radarBox">
    <div id="radarMoon"></div>
    <div id="radarPlayer"></div>
  </div>
</div>

<div id="controls">
  <div class="btn-group">
    <button class="ctrl" id="btnLeft">◀</button>
    <button class="ctrl" id="btnRight">▶</button>
  </div>
  <div class="btn-group">
    <button class="ctrl" id="btnUp">▲</button>
    <button class="ctrl" id="btnDown">▼</button>
  </div>
</div>

<div id="overlay">
  <h1 id="ovTitle">🚀 3D Moon Mission</h1>
  <p id="ovDesc"><strong>Step 1:</strong> Walk your astronaut forward (▲) into the rocket.<br><strong>Step 2:</strong> Fly through the 3D galaxy, follow the radar map, escape stones & aliens, and land on the Moon!</p>
  <button id="startBtn" onclick="startGame()">START 3D MISSION</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resize);
  resize();

  let state = "MENU";
  let health = 100;
  let dist = 1000;
  let player = { x: 0, y: 0, z: 100 };
  let keys = {};
  let stars = [];
  let hazards = [];

  for (let i = 0; i < 200; i++) {
    stars.push({ x: (Math.random() - 0.5) * 2000, y: (Math.random() - 0.5) * 2000, z: Math.random() * 1000 });
  }

  window.addEventListener("keydown", function(e) { keys[e.key] = true; });
  window.addEventListener("keyup", function(e) { keys[e.key] = false; });

  function bindBtn(id, k) {
    const el = document.getElementById(id);
    el.addEventListener("touchstart", function(e) { e.preventDefault(); keys[k] = true; });
    el.addEventListener("touchend", function(e) { e.preventDefault(); keys[k] = false; });
    el.addEventListener("mousedown", function() { keys[k] = true; });
    el.addEventListener("mouseup", function() { keys[k] = false; });
  }
  bindBtn("btnLeft", "ArrowLeft");
  bindBtn("btnRight", "ArrowRight");
  bindBtn("btnUp", "ArrowUp");
  bindBtn("btnDown", "ArrowDown");

  function startGame() {
    document.getElementById("overlay").style.display = "none";
    health = 100;
    dist = 1000;
    player = { x: 0, y: 120, z: 100 };
    hazards = [];
    for (let i = 0; i < 35; i++) {
      hazards.push({
        x: (Math.random() - 0.5) * 600,
        y: (Math.random() - 0.5) * 400,
        z: 300 + i * 180,
        type: i % 2 === 0 ? "stone" : "alien"
      });
    }
    state = "WALKING";
    document.getElementById("phaseText").innerHTML = "<strong>Phase 1:</strong> Walk to the Rocket 🚀";
    document.getElementById("hpText").textContent = "Hull Integrity: 100%";
  }

  function endGame(won, msg) {
    state = "END";
    document.getElementById("ovTitle").textContent = won ? "🌕 MOON LANDING SUCCESS!" : "💥 MISSION FAILED";
    document.getElementById("ovDesc").textContent = msg;
    document.getElementById("startBtn").textContent = "PLAY AGAIN";
    document.getElementById("overlay").style.display = "flex";
  }

  function project(x, y, z) {
    const fov = 350;
    const scale = fov / (fov + z);
    return { x: W / 2 + x * scale, y: H / 2 + y * scale, scale: scale };
  }

  function loop() {
    requestAnimationFrame(loop);
    ctx.fillStyle = "#030614";
    ctx.fillRect(0, 0, W, H);

    // Draw 3D Galaxy Nebula Glow
    const grad = ctx.createRadialGradient(W * 0.3, H * 0.3, 20, W * 0.3, H * 0.3, 350);
    grad.addColorStop(0, "rgba(76, 201, 240, 0.18)");
    grad.addColorStop(0.5, "rgba(114, 9, 183, 0.12)");
    grad.addColorStop(1, "transparent");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Draw 3D Moving Stars
    ctx.fillStyle = "#ffffff";
    for (let i = 0; i < stars.length; i++) {
      let s = stars[i];
      if (state === "FLYING") s.z -= 8;
      if (s.z <= 1) s.z = 1000;
      let p = project(s.x, s.y, s.z);
      ctx.fillRect(p.x, p.y, 2.5 * p.scale, 2.5 * p.scale);
    }

    if (state === "WALKING") {
      // Draw 3D Launchpad Grid
      ctx.strokeStyle = "#2b3d54";
      ctx.beginPath();
      ctx.ellipse(W / 2, H * 0.72, 220, 60, 0, 0, Math.PI * 2);
      ctx.stroke();

      // Draw Rocket waiting on pad
      let rp = project(0, 20, 350);
      ctx.font = Math.floor(110 * rp.scale) + "px Arial";
      ctx.textAlign = "center";
      ctx.fillText("🚀", rp.x, rp.y);

      // Move Astronaut
      if (keys["ArrowUp"]) player.z += 4;
      if (keys["ArrowDown"] && player.z > 60) player.z -= 4;
      if (keys["ArrowLeft"]) player.x -= 4;
      if (keys["ArrowRight"]) player.x += 4;

      let ap = project(player.x, 80, player.z);
      ctx.font = Math.floor(70 * ap.scale) + "px Arial";
      ctx.fillText("🧑‍🚀", ap.x, ap.y);

      if (player.z >= 320 && Math.abs(player.x) < 60) {
        state = "FLYING";
        player.x = 0;
        player.y = 0;
        document.getElementById("phaseText").innerHTML = "<strong>Phase 2:</strong> Pilot Rocket to Moon 🌕";
      }
    } else if (state === "FLYING") {
      dist -= 1.2;
      if (keys["ArrowLeft"] && player.x > -280) player.x -= 6;
      if (keys["ArrowRight"] && player.x < 280) player.x += 6;
      if (keys["ArrowUp"] && player.y > -180) player.y -= 6;
      if (keys["ArrowDown"] && player.y < 180) player.y += 6;

      // Draw Background Planets in 3D perspective
      let earthP = project(-260 - player.x * 0.3, -90 - player.y * 0.3, 600);
      ctx.font = Math.floor(120 * earthP.scale) + "px Arial";
      ctx.fillText("🪐", earthP.x, earthP.y);

      // Draw Destination Moon growing closer
      let moonZ = Math.max(50, dist * 1.5);
      let moonP = project(-player.x * 0.5, -player.y * 0.5, moonZ);
      ctx.font = Math.floor(160 * moonP.scale) + "px Arial";
      ctx.fillText("🌕", moonP.x, moonP.y);

      // Draw & Move Stones and Alien UFOs
      for (let i = 0; i < hazards.length; i++) {
        let h = hazards[i];
        h.z -= 9;
        if (h.type === "alien") h.x += Math.sin(Date.now() * 0.004 + i) * 3;
        if (h.z < 10) {
          h.z = 1200;
          h.x = (Math.random() - 0.5) * 600;
          h.y = (Math.random() - 0.5) * 400;
        }
        let hp = project(h.x - player.x, h.y - player.y, h.z);
        ctx.font = Math.floor(65 * hp.scale) + "px Arial";
        ctx.fillText(h.type === "alien" ? "🛸" : "🪨", hp.x, hp.y);

        // Collision check
        if (h.z < 65 && Math.abs(h.x - player.x) < 55 && Math.abs(h.y - player.y) < 55) {
          h.z = 1200;
          health -= 25;
          document.getElementById("hpText").textContent = "Hull Integrity: " + health + "%";
          if (health <= 0) {
            endGame(false, "Your rocket was hit by space stones and alien UFOs!");
            return;
          }
        }
      }

      // Draw Player Rocket in foreground
      ctx.font = "64px Arial";
      ctx.textAlign = "center";
      ctx.fillText("🚀", W / 2, H * 0.78);

      // Update HUD & Radar Map
      document.getElementById("distText").textContent = "Distance to Moon: " + Math.max(0, Math.floor(dist)) + " km";
      let prog = Math.min(1, (1000 - dist) / 1000);
      document.getElementById("radarPlayer").style.bottom = (12 + prog * 75) + "px";
      document.getElementById("radarPlayer").style.left = (51 + (player.x / 280) * 35) + "px";

      if (dist <= 0) 
      endGame(true, "Congratulations! You successfully landed on the Moon! 🌕");
    }
    }
    
    loop();
