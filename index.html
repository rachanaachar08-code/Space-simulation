<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Moon Mission</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { overflow: hidden; background: #02040c; font-family: Arial, sans-serif; color: white; }
    #hud {
      position: absolute; top: 15px; left: 15px; right: 15px;
      display: flex; justify-content: space-between; align-items: flex-start;
      pointer-events: none; z-index: 10;
    }
    .panel {
      background: rgba(11, 19, 43, 0.85); border: 1px solid #3a86ff;
      padding: 12px 16px; border-radius: 10px; font-size: 14px;
    }
    #radarBox {
      width: 120px; height: 120px; border-radius: 50%;
      background: rgba(5, 20, 40, 0.9); border: 2px solid #4cc9f0;
      position: relative; overflow: hidden;
    }
    #radarMoon {
      width: 12px; height: 12px; background: #ffd166; border-radius: 50%;
      position: absolute; top: 10px; left: 54px; box-shadow: 0 0 8px #ffd166;
    }
    #radarPlayer {
      width: 8px; height: 8px; background: #00f5d4; border-radius: 50%;
      position: absolute; bottom: 12px; left: 56px;
    }
    #controls {
      position: absolute; bottom: 25px; left: 20px; right: 20px;
      display: flex; justify-content: space-between; z-index: 15;
    }
    .btn-group { display: flex; gap: 10px; }
    button.ctrl {
      width: 60px; height: 60px; border-radius: 50%;
      background: rgba(58, 134, 255, 0.5); border: 2px solid #4cc9f0;
      color: white; font-size: 22px; font-weight: bold; touch-action: manipulation;
    }
    button.ctrl:active { background: #3a86ff; }
    #overlay {
      position: absolute; inset: 0; background: rgba(5, 8, 20, 0.92);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 25px; z-index: 30;
    }
    #overlay h1 { color: #4cc9f0; font-size: 28px; margin-bottom: 12px; }
    #overlay p { color: #a9bcd0; max-width: 420px; margin-bottom: 22px; line-height: 1.5; }
    #startBtn {
      background: #3a86ff; border: none; padding: 15px 34px;
      font-size: 18px; font-weight: bold; color: white; border-radius: 8px; cursor: pointer;
    }
  </style>
  <script src="https://unpkg.com"></script>
</head>
<body>

<div id="hud">
  <div class="panel">
    <div id="phaseText"><strong>Phase 1:</strong> Walk to the Rocket 🚀</div>
    <div id="distText" style="color:#4cc9f0; margin-top:4px;">Distance to Moon: 1000 km</div>
    <div id="hpText" style="color:#ff4d4d; margin-top:4px;">Hull Integrity: 100%</div>
  </div>
  <div id="radarBox">
    <div id="radarMoon"></div>
    <div id="radarPlayer"></div>
  </div>
</div>

<div id="controls">
  <div class="btn-group">
    <button class="ctrl" id="btnLeft">◀</button>
    <button class="ctrl" id="btnRight">▶</button>
  </div>
  <div class="btn-group">
    <button class="ctrl" id="btnUp">▲</button>
    <button class="ctrl" id="btnDown">▼</button>
  </div>
</div>

<div id="overlay">
  <h1 id="ovTitle">🚀 3D Moon Mission</h1>
  <p id="ovDesc"><strong>Step 1:</strong> Walk your astronaut forward into the rocket.<br><strong>Step 2:</strong> Fly through the 3D galaxy, follow the radar map, dodge stones and alien UFOs, and land on the Moon!</p>
  <button id="startBtn" type="button">START 3D MISSION</button>
</div>

<script>
  window.onerror = function(msg, url, line) {
    alert("Error: " + msg + " on line " + line);
  };

  let scene, camera, renderer;
  let astronaut, rocket, moon, earth, saturn;
  let hazards = [];
  let gameState = "MENU";
  let health = 100;
  let keys = {};
  let initialized = false;

  function init3D() {
    if (initialized) return;
    initialized = true;

    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x02040c, 0.0018);

    camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 2000);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const ambient = new THREE.AmbientLight(0x667799, 1.5);
    scene.add(ambient);
    const sunLight = new THREE.PointLight(0xffffff, 2, 1500);
    sunLight.position.set(100, 150, 100);
    scene.add(sunLight);

    const starGeo = new THREE.BufferGeometry();
    const starCoords = [];
    for (let i = 0; i < 2500; i++) {
      starCoords.push((Math.random() - 0.5) * 1600, (Math.random() - 0.5) * 1600, -Math.random() * 1400 + 200);
    }
    starGeo.setAttribute("position", new THREE.Float32BufferAttribute(starCoords, 3));
    const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.8 });
    scene.add(new THREE.Points(starGeo, starMat));

    const pad = new THREE.Mesh(
      new THREE.CylinderGeometry(18, 20, 1, 32),
      new THREE.MeshStandardMaterial({ color: 0x2b3d54 })
    );
    pad.position.set(0, -2, -10);
    scene.add(pad);

    astronaut = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 1.8, 16), new THREE.MeshStandardMaterial({ color: 0xffffff }));
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.65, 16, 16), new THREE.MeshStandardMaterial({ color: 0x4cc9f0 }));
    head.position.y = 1.4;
    astronaut.add(body, head);
    astronaut.position.set(0, 0, 4);
    scene.add(astronaut);

    rocket = new THREE.Group();
    const fuselage = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.6, 7, 20), new THREE.MeshStandardMaterial({ color: 0xe0e1dd }));
    const nose = new THREE.Mesh(new THREE.ConeGeometry(1.4, 2.8, 20), new THREE.MeshStandardMaterial({ color: 0xff4d4d }));
    nose.position.y = 4.9;
    const boosterL = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.5, 4, 12), new THREE.MeshStandardMaterial({ color: 0x3a86ff }));
    boosterL.position.set(-1.8, -1.2, 0);
    const boosterR = boosterL.clone();
    boosterR.position.set(1.8, -1.2, 0);
    rocket.add(fuselage, nose, boosterL, boosterR);
    rocket.position.set(0, 2, -12);
    scene.add(rocket);

    earth = new THREE.Mesh(new THREE.SphereGeometry(28, 32, 32), new THREE.MeshStandardMaterial({ color: 0x2667ff }));
    earth.position.set(-75, -15, -180);
    scene.add(earth);

    saturn = new THREE.Mesh(new THREE.SphereGeometry(35, 32, 32), new THREE.MeshStandardMaterial({ color: 0xfca311 }));
    saturn.position.set(95, 30, -520);
    const ring = new THREE.Mesh(new THREE.RingGeometry(42, 60, 32), new THREE.MeshBasicMaterial({ color: 0xe5e5e5, side: THREE.DoubleSide }));
    ring.rotation.x = Math.PI / 2.5;
    saturn.add(ring);
    scene.add(saturn);

    moon = new THREE.Mesh(new THREE.SphereGeometry(32, 32, 32), new THREE.MeshStandardMaterial({ color: 0xd9d9d9 }));
    moon.position.set(0, 0, -1000);
    scene.add(moon);

    for (let i = 0; i < 45; i++) {
      const isAlien = i % 3 === 0;
      let obj;
      if (isAlien) {
        obj = new THREE.Mesh(new THREE.TorusGeometry(2.2, 0.7, 12, 24), new THREE.MeshStandardMaterial({ color: 0x00f5d4, emissive: 0x005544 }));
        obj.rotation.x = Math.PI / 2;
      } else {
        obj = new THREE.Mesh(new THREE.DodecahedronGeometry(2.4), new THREE.MeshStandardMaterial({ color: 0x8d6e63 }));
      }
      obj.position.set((Math.random() - 0.5) * 48, (Math.random() - 0.5) * 28, -80 - (i * 20));
      obj.userData = { isAlien: isAlien };
      scene.add(obj);
      hazards.push(obj);
    }

    setupControls();
    animate();
  }

  function setupControls() {
    window.addEventListener("keydown", function(e) { keys[e.key] = true; });
    window.addEventListener("keyup", function(e) { keys[e.key] = false; });

    function bindTouch(id, keyName) {
      const el = document.getElementById(id);
      el.addEventListener("touchstart", function(e) { e.preventDefault(); keys[keyName] = true; });
      el.addEventListener("touchend", function(e) { e.preventDefault(); keys[keyName] = false; });
      el.addEventListener("mousedown", function() { keys[keyName] = true; });
      el.addEventListener("mouseup", function() { keys[keyName] = false; });
    }
    bindTouch("btnLeft", "ArrowLeft");
    bindTouch("btnRight", "ArrowRight");
    bindTouch("btnUp", "ArrowUp");
    bindTouch("btnDown", "ArrowDown");
  }

  function startGame() {
    init3D();
    document.getElementById("overlay").style.display = "none";
    health = 100;
    astronaut.visible = true;
    astronaut.position.set(0, 0, 4);
    rocket.position.set(0, 2, -12);
    rocket.rotation.set(0, 0, 0);
    for (let i = 0; i < hazards.length; i++) {
      hazards[i].visible = true;
    }
    gameState = "WALKING";
    document.getElementById("phaseText").innerHTML = "<strong>Phase 1:</strong> Walk to the Rocket 🚀";
    document.getElementById("hpText").textContent = "Hull Integrity: 100%";
  }

  function endGame(won, msg) {
    gameState = "END";
    document.getElementById("ovTitle").textContent = won ? "🌕 MOON LANDING SUCCESS!" : "💥 MISSION FAILED";
    document.getElementById("ovDesc").textContent = msg;
    document.getElementById("startBtn").textContent = "PLAY AGAIN";
    document.getElementById("overlay").style.display = "flex";
  }

  function animate() {
    requestAnimationFrame(animate);

    if (gameState === "WALKING") {
      if (keys["ArrowUp"]) astronaut.position.z -= 0.25;
      if (keys["ArrowDown"]) astronaut.position.z += 0.25;
      if (keys["ArrowLeft"]) astronaut.position.x -= 0.25;
      if (keys["ArrowRight"]) astronaut.position.x += 0.25;

      camera.position.set(astronaut.position.x, astronaut.position.y + 4, astronaut.position.z + 10);
      camera.lookAt(rocket.position);

      if (astronaut.position.distanceTo(rocket.position) < 4.5) {
        astronaut.visible = false;
        rocket.rotation.x = -Math.PI / 2;
        gameState = "FLYING";
Use code with caution.
document.getElementById("phaseText").innerHTML = "Phase 2: Pilot Rocket to Moon 🌕";
}
} else if (gameState === "FLYING") {
rocket.position.z -= 1.4;
if (keys["ArrowLeft"] && rocket.position.x > -24) rocket.position.x -= 0.5;
if (keys["ArrowRight"] && rocket.position.x < 24) rocket.position.x += 0.5;
if (keys["ArrowUp"] && rocket.position.y < 15) rocket.position.y += 0.5;
if (keys["ArrowDown"] && rocket.position.y > -15) rocket.position.y -= 0.5;
camera.position.set(rocket.position.x * 0.7, rocket.position.y + 5, rocket.position.z + 16);
camera.lookAt(rocket.position.x, rocket.position.y, rocket.position.z - 20);
const dist = Math.max(0, Math.floor(Math.abs(moon.position.z - rocket.position.z) - 32));
document.getElementById("distText").textContent = "Distance to Moon: " + dist + " km";
const progress = Math.min(1, Math.abs(rocket.position.z) / 968);
document.getElementById("radarPlayer").style.bottom = (12 + progress * 85) + "px";
document.getElementById("radarPlayer").style.left = (56 + (rocket.position.x / 25) * 38) + "px";
for (let i = 0; i < hazards.length; i++) {
const h = hazards[i];
h.rotation.y += 0.03;
if (h.userData.isAlien) h.position.x += Math.sin(Date.now() * 0.003 + h.position.z) * 0.15;
if (h.visible && rocket.position.distanceTo(h.position) < 3.6) {
h.visible = false;
health -= 25;
document.getElementById("hpText").textContent = "Hull Integrity: " + health + "%";
if (health <= 0) {
endGame(false, "Your rocket was destroyed by space stones and aliens!");
break;
}
}
}
if (dist <= 5) {
endGame(true, "You navigated through the galaxy, escaped aliens and stones, and landed on the Moon!");
}
}
earth.rotation.y += 0.002;
saturn.rotation.y += 0.002;
moon.rotation.y += 0.002;
renderer.render(scene, camera);
}
document.getElementById("startBtn").addEventListener("click", startGame);
window.addEventListener("resize", function() {
if (!camera || !renderer) return;
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
});



### What Changed in This Fix
* **Direct Button Listener:** Attached `addEventListener("click", startGame)` directly in JavaScript and initialized the 3D scene the moment you tap **START 3D MISSION**.
* **Reliable CDN & Zero Backticks:** Switched Three.js to `unpkg.com` and removed all template backticks so copy-pasting never causes syntax errors.
* **Built-In Error Alert:** If anything ever fails to load, an exact alert box will tell you why instead of leaving the button unresponsive.
