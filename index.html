<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Space Shooter & Coin Runner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #050814;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    #hud {
      position: absolute;
      top: 15px;
      width: 92%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      font-size: 16px;
      font-weight: bold;
      z-index: 10;
      background: rgba(28, 37, 65, 0.8);
      padding: 10px 15px;
      border-radius: 10px;
      border: 1px solid #3a506b;
    }
    .coin-text { color: #ffd166; }
    .dist-text { color: #4cc9f0; }
    .hp-text { color: #ff4d4d; }
    canvas {
      background: radial-gradient(circle at center, #0b132b 0%, #02040a 100%);
      border: 2px solid #3a506b;
      border-radius: 10px;
      max-width: 100%;
      max-height: 100%;
      touch-action: none;
    }
    #overlay {
      position: absolute;
      background: rgba(11, 19, 43, 0.92);
      padding: 30px;
      border-radius: 14px;
      border: 2px solid #3a86ff;
      text-align: center;
      z-index: 20;
      max-width: 340px;
    }
    h1 { font-size: 24px; margin-bottom: 10px; color: #4cc9f0; }
    p { font-size: 14px; color: #a9bcd0; margin-bottom: 20px; line-height: 1.5; }
    button {
      background-color: #3a86ff;
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background-color: #2667ff; }
  </style>
</head>
<body>

<div id="hud">
  <span class="coin-text">🪙 Coins: <span id="coins">0</span></span>
  <span class="dist-text">🚀 <span id="distance">0</span> km</span>
  <span class="hp-text">❤️ <span id="health">100</span>%</span>
</div>

<div id="overlay">
  <h1 id="titleText">🚀 Space Combat Runner</h1>
  <p id="descText">Drag your finger (or move mouse/arrows) to steer your ship. Auto-lasers blast asteroids while you collect gold space coins!</p>
  <button onclick="startGame()">PLAY MISSION</button>
</div>

<canvas id="gameCanvas" width="420" height="700"></canvas>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  let gameRunning = false;
  let coins = 0;
  let distance = 0;
  let health = 100;
  let frameCount = 0;

  // Player Spaceship
  const player = { x: 185, y: 580, width: 45, height: 50, speed: 7 };

  let bullets = [];
  let enemies = [];
  let coinItems = [];
  let stars = [];

  // Create scrolling space stars
  for (let i = 0; i < 60; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: Math.random() * 2 + 1,
      speed: Math.random() * 3 + 1
    });
  }

  // Controls: Touch & Mouse Drag
  function movePlayerTo(clientX) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    let targetX = (clientX - rect.left) * scaleX - player.width / 2;
    player.x = Math.max(0, Math.min(canvas.width - player.width, targetX));
  }

  canvas.addEventListener("touchmove", (e) => {
    e.preventDefault();
    movePlayerTo(e.touches[0].clientX);
  }, { passive: false });

  canvas.addEventListener("mousemove", (e) => {
    if (gameRunning) movePlayerTo(e.clientX);
  });

  // Keyboard Arrow Controls
  const keys = {};
  window.addEventListener("keydown", (e) => keys[e.key] = true);
  window.addEventListener("keyup", (e) => keys[e.key] = false);

  function startGame() {
    document.getElementById("overlay").style.display = "none";
    coins = 0;
    distance = 0;
    health = 100;
    bullets = [];
    enemies = [];
    coinItems = [];
    player.x = canvas.width / 2 - player.width / 2;
    gameRunning = true;
    updateHUD();
    requestAnimationFrame(gameLoop);
  }

  function updateHUD() {
    document.getElementById("coins").textContent = coins;
    document.getElementById("distance").textContent = Math.floor(distance);
    document.getElementById("health").textContent = health;
  }

  function gameOver() {
    gameRunning = false;
    document.getElementById("titleText").textContent = "💥 SHIP DESTROYED";
    document.getElementById("descText").innerHTML = `Distance Traveled: <strong>${Math.floor(distance)} km</strong><br>Coins Collected: <strong>🪙 ${coins}</strong>`;
    document.getElementById("overlay").style.display = "block";
  }

  function gameLoop() {
    if (!gameRunning) return;
    frameCount++;
    distance += 0.5;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw & scroll space background stars
    ctx.fillStyle = "#ffffff";
    stars.forEach(s => {
      s.y += s.speed;
      if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; }
      ctx.fillRect(s.x, s.y, s.size, s.size);
    });

    // Keyboard movement
    if (keys["ArrowLeft"] && player.x > 0) player.x -= player.speed;
    if (keys["ArrowRight"] && player.x < canvas.width - player.width) player.x += player.speed;

    // Auto-fire lasers (Free Fire action feel)
    if (frameCount % 12 === 0) {
      bullets.push({ x: player.x + player.width / 2 - 3, y: player.y, width: 6, height: 16 });
    }

    // Spawn Asteroids & Enemy Drones
    if (frameCount % 35 === 0) {
      enemies.push({
        x: Math.random() * (canvas.width - 40),
        y: -40,
        width: 40,
        height: 40,
        speed: 3 + Math.random() * 2.5
      });
    }

    // Spawn Lines of Gold Coins (Subway Surfers style)
    if (frameCount % 90 === 0) {
      const laneX = Math.random() * (canvas.width - 40) + 10;
      for (let i = 0; i < 4; i++) {
        coinItems.push({ x: laneX, y: -40 - (i * 45), radius: 12, speed: 4 });
      }
    }

    // Draw Player Rocket
    ctx.font = "40px Arial";
    ctx.fillText("🚀", player.x, player.y + 40);

    // Update & Draw Laser Bullets
    ctx.fillStyle = "#00f5d4";
    for (let i = bullets.length - 1; i >= 0; i--) {
      let b = bullets[i];
      b.y -= 10;
      ctx.fillRect(b.x, b.y, b.width, b.height);
      if (b.y < 0) bullets.splice(i, 1);
    }

    // Update & Draw Coins
    for (let i = coinItems.length - 1; i >= 0; i--) {
      let c = coinItems[i];
      c.y += c.speed;
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
      ctx.fillStyle = "#ffd166";
      ctx.fill();
      ctx.strokeStyle = "#f77f00";
      ctx.lineWidth = 3;
      ctx.stroke();

      // Check coin collection
      if (
        c.x + c.radius > player.x &&
        c.x - c.radius < player.x + player.width &&
        c.y + c.radius > player.y &&
        c.y - c.radius < player.y + player.height
      ) {
        coins += 10;
        coinItems.splice(i, 1);
        continue;
      }
      if (c.y > canvas.height) coinItems.splice(i, 1);
    }

    // Update & Draw Enemies / Asteroids
    ctx.font = "36px Arial";
    for (let i = enemies.length - 1; i >= 0; i--) {
      let e = enemies[i];
      e.y += e.speed;
      ctx.fillText("☄️", e.x, e.y + 32);

      // Check bullet hit on asteroid
      let hit = false;
      for (let j = bullets.length - 1; j >= 0; j--) {
        let b = bullets[j];
        if (b.x < e.x + e.width && b.x + b.width > e.x && b.y < e.y + e.height && b.y + b.height > e.y) {
          bullets.splice(j, 1);
          enemies.splice(i, 1);
          coins += 5; // Bonus coins for shooting asteroids!
          hit = true;
          break;
        }
      }
      if (hit) continue;

      // Check crash with player
      if (
        e.x < player.x + player.width - 8 &&
        e.x + e.width - 8 > player.x &&
        e.y < player.y + player.height - 8 &&
        e.y + e.height - 8 > player.y
      ) {
        health -= 25;
        enemies.splice(i, 1);
        if (health <= 0) {
          health = 0;
          updateHUD();
          gameOver();
          return;
        }
      }

      if (e.y > canvas.height) enemies.splice(i, 1);
    }

    updateHUD();
    requestAnimationFrame(gameLoop);
  }
</script>

</body>
</html>
